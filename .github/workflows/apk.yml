name: APK bauen
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: EpubReader-APK
          path: app/build/outputs/apk/release/*.apk
      - name: Download-Link erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v4.0 --yes --cleanup-tag || true
          gh release create android-v4.0 app/build/outputs/apk/release/*.apk --title "EPUB-Reader Android 4.0" --notes "APK für den Fold 8" --target android
